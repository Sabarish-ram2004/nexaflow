<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexaFlow - Manager Dashboard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="container">
    <h4 class="mb-4">Manager Dashboard</h4>

    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="nf-stat-card bg-nf-1">
          <div>Team Size</div>
          <h2 id="stat-team">-</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="nf-stat-card bg-nf-2">
          <div>Pending Tasks</div>
          <h2 id="stat-pending-tasks">-</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="nf-stat-card bg-nf-4">
          <div>Completed Tasks</div>
          <h2 id="stat-completed-tasks">-</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="nf-stat-card bg-nf-3">
          <div>Pending Leaves</div>
          <h2 id="stat-leaves">-</h2>
        </div>
      </div>
    </div>

    <div class="card nf-card p-3">
      <h6>Quick links</h6>
      <div class="d-flex gap-2 flex-wrap">
        <a href="employees.html" class="btn btn-outline-primary btn-sm">My Team</a>
        <a href="tasks.html" class="btn btn-outline-primary btn-sm">Assign Tasks</a>
        <a href="attendance.html" class="btn btn-outline-primary btn-sm">Team Attendance</a>
        <a href="leave.html" class="btn btn-outline-primary btn-sm">Review Leave</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    requireAuth(["MANAGER"]);
    renderNavbar("manager-dashboard.html");

    async function loadStats() {
      try {
        const team = await apiRequest("/api/users/employees");
        document.getElementById("stat-team").textContent = team.length;

        const tasks = await apiRequest("/api/tasks");
        const pending = tasks.filter(t => t.status !== "COMPLETED").length;
        const completed = tasks.filter(t => t.status === "COMPLETED").length;
        document.getElementById("stat-pending-tasks").textContent = pending;
        document.getElementById("stat-completed-tasks").textContent = completed;

        const leaves = await apiRequest("/api/leave/pending");
        const pendingLeaves = leaves.filter(l => l.status === "PENDING");
        document.getElementById("stat-leaves").textContent = pendingLeaves.length;
      } catch (err) {
        showError(err.message);
      }
    }
    loadStats();
  </script>
</body>
</html>
