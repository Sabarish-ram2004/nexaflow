<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexaFlow - Managers</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>Managers</h4>
      <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addManagerModal">+ Add Manager</button>
    </div>

    <div class="card nf-card p-3">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Team Size</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="manager-table-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Add Manager Modal -->
  <div class="modal fade" id="addManagerModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Manager</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addManagerForm">
            <div class="mb-2">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" id="mgr-name" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="mgr-email" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Temporary Password</label>
              <input type="text" class="form-control" id="mgr-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create Manager</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    requireAuth(["OWNER"]);
    renderNavbar("managers.html");

    async function loadManagers() {
      try {
        const managers = await apiRequest("/api/users/managers");
        const employees = await apiRequest("/api/users/employees");

        const tbody = document.getElementById("manager-table-body");
        tbody.innerHTML = managers.map(m => {
          const teamSize = employees.filter(e => e.managerId === m.id).length;
          return `
            <tr>
              <td>${m.name}</td>
              <td>${m.email}</td>
              <td>${teamSize}</td>
              <td>${m.active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>'}</td>
            </tr>
          `;
        }).join("");
      } catch (err) { showError(err.message); }
    }

    document.getElementById("addManagerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById("mgr-name").value,
        email: document.getElementById("mgr-email").value,
        password: document.getElementById("mgr-password").value,
      };
      try {
        await apiRequest("/api/users/managers", "POST", payload);
        bootstrap.Modal.getInstance(document.getElementById("addManagerModal")).hide();
        e.target.reset();
        loadManagers();
      } catch (err) { showError(err.message); }
    });

    loadManagers();
  </script>
</body>
</html>
