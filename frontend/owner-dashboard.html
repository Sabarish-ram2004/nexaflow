<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexaFlow - Owner Dashboard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="container">
    <h4 class="mb-4">Owner Dashboard</h4>

    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="nf-stat-card bg-nf-1">
          <div>Total Employees</div>
          <h2 id="stat-employees">-</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="nf-stat-card bg-nf-2">
          <div>Total Managers</div>
          <h2 id="stat-managers">-</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="nf-stat-card bg-nf-3">
          <div>Pending Leaves</div>
          <h2 id="stat-leaves">-</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="nf-stat-card bg-nf-4">
          <div>Total Tasks</div>
          <h2 id="stat-tasks">-</h2>
        </div>
      </div>
    </div>

    <div class="card nf-card p-3">
      <h6>Quick links</h6>
      <div class="d-flex gap-2 flex-wrap">
        <a href="employees.html" class="btn btn-outline-primary btn-sm">Manage Employees</a>
        <a href="managers.html" class="btn btn-outline-primary btn-sm">Manage Managers</a>
        <a href="tasks.html" class="btn btn-outline-primary btn-sm">View Tasks</a>
        <a href="attendance.html" class="btn btn-outline-primary btn-sm">View Attendance</a>
        <a href="leave.html" class="btn btn-outline-primary btn-sm">Review Leave</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    requireAuth(["OWNER"]);
    renderNavbar("owner-dashboard.html");

    async function loadStats() {
      try {
        const employees = await apiRequest("/api/users/employees");
        document.getElementById("stat-employees").textContent = employees.length;

        const managers = await apiRequest("/api/users/managers");
        document.getElementById("stat-managers").textContent = managers.length;

        const leaves = await apiRequest("/api/leave/pending");
        const pending = leaves.filter(l => l.status === "PENDING");
        document.getElementById("stat-leaves").textContent = pending.length;

        const tasks = await apiRequest("/api/tasks");
        document.getElementById("stat-tasks").textContent = tasks.length;
      } catch (err) {
        showError(err.message);
      }
    }
    loadStats();
  </script>
</body>
</html>
