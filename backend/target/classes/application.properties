spring.application.name=nexaflow

# ---- Database ----
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://dpg-daf51p8n74is738c5hig-a:5432/nexaflow_db_vfmk}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- JWT ----
jwt.secret=${JWT_SECRET:myBackendSecretKey12345ChangeThisLater987654321}
jwt.expiration-ms=86400000

# ---- Server ----
server.port=${PORT:8080}

# ---- Default Owner account (created automatically on first run if no owner exists) ----
nexaflow.default-owner.email=${DEFAULT_OWNER_EMAIL:owner@nexaflow.com}
nexaflow.default-owner.password=${DEFAULT_OWNER_PASSWORD:Owner@123}
nexaflow.default-owner.name=System Owner

# ---- Demo data (created automatically on first run if no Manager exists yet) ----
nexaflow.seed-demo-data=${SEED_DEMO_DATA:true}

# ---- CORS ----
nexaflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}