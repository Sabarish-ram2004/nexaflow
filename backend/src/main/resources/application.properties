spring.application.name=nexaflow

# ---- Database ----
#   CREATE DATABASE nexaflow_db;
spring.datasource.url=jdbc:postgresql://localhost:5432/nexaflow_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- JWT ----
# Secret must be at least 256 bits (32+ characters) for HS256
jwt.secret=nexaflow_super_secret_key_change_this_in_production_123456789
jwt.expiration-ms=86400000

# ---- Server ----
server.port=8080

# ---- Default Owner account (created automatically on first run if no owner exists) ----
nexaflow.default-owner.email=owner@nexaflow.com
nexaflow.default-owner.password=Owner@123
nexaflow.default-owner.name=System Owner

# ---- Demo data (created automatically on first run if no Manager exists yet) ----
# Set to false once you don't want sample Manager/Employees/Task recreated on a fresh DB.
nexaflow.seed-demo-data=true
